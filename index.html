<!DOCTYPE html>
<!--
  index.html  —  O "esqueleto" da página
  ------------------------------------------------------------
  HTML só descreve O QUE existe na tela. A aparência está em
  css/style.css e o comportamento em js/app.js.

  Várias partes aqui ficam vazias de propósito (turno, serviços, resumo,
  cards, relatório): o app.js preenche essas partes conforme os dados.
-->
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Leitor de Pedidos</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <main class="wrap">

    <header>
      <h1>Leitor de Pedidos</h1>
      <p class="lead">Cole as mensagens do WhatsApp. Cada pedido vira um card pronto pra colocar no Spoke.</p>
    </header>

    <!-- Barra das entregas do dia: abrir, ver o andamento, fechar -->
    <section class="turno" id="turno" aria-label="Entregas do dia"></section>

    <!-- Mensagens curtas de status (salvo, erro...) -->
    <p class="status" id="status" hidden></p>

    <!-- TELA PRINCIPAL -->
    <div class="stack" id="main">

      <section class="paste" aria-label="Mensagens">
        <div class="f">
          <span class="lab">Serviço</span>
          <div class="seg" id="servicos"></div>
          <div class="row" id="novo" hidden>
            <input class="in" id="novoNome" placeholder="Nome do serviço" autocomplete="off">
            <button class="b1" id="novoOk" type="button">Salvar</button>
          </div>
          <!-- Apagar serviço: o app.js mostra o link e as duas perguntas aqui -->
          <div class="notes" id="svcdel"></div>
        </div>

        <div class="f">
          <label class="lab" for="valorPadrao">Valor por entrega (R$)</label>
          <input class="in sm" id="valorPadrao" inputmode="decimal" autocomplete="off">
          <span class="hint">Vale pra todos os cards. Em entrega mais longa, mude só no card dela.</span>
        </div>

        <div class="paste-head">
          <label class="lab" for="src">Mensagens coladas</label>
          <span class="demo" id="demo">Exemplo com dados inventados</span>
        </div>
        <textarea id="src" spellcheck="false" placeholder="Cole aqui as mensagens do WhatsApp"></textarea>
        <div class="row">
          <button class="b1" id="run" type="button">Ler pedidos</button>
          <button class="b2" id="clear" type="button">Limpar</button>
        </div>

        <!-- Pedido que não veio no padrão (ex.: print do iFood): preencher na mão -->
        <button class="b2" id="manualBtn" type="button">Inserir dados manualmente</button>

        <!-- Telinha de preenchimento manual (o app.js abre e fecha) -->
        <div class="manual" id="manual" hidden>
          <span class="lab">Novo pedido manual</span>

          <div class="f">
            <label class="lab" for="mNome">Nome</label>
            <input class="in nm" id="mNome" autocomplete="off">
          </div>
          <div class="f">
            <label class="lab" for="mBairro">Bairro</label>
            <input class="in" id="mBairro" autocomplete="off">
          </div>
          <div class="f">
            <label class="lab" for="mEnd">Endereço (rua e número)</label>
            <input class="in ad" id="mEnd" placeholder="Rua X, 123" autocomplete="off">
          </div>

          <div class="f">
            <span class="lab">Pagamento</span>
            <div class="seg" id="mForma">
              <button class="b2" type="button" data-mf="dinheiro" aria-pressed="false">Dinheiro</button>
              <button class="b2" type="button" data-mf="cartao" aria-pressed="false">Cartão</button>
              <button class="b2" type="button" data-mf="pix" aria-pressed="false">Pix</button>
              <button class="b2" type="button" data-mf="pago" aria-pressed="false">Pago</button>
            </div>
          </div>
          <div class="pay-in" id="mValores">
            <div class="f">
              <label class="lab" for="mValor">Valor (R$)</label>
              <input class="in sm" id="mValor" inputmode="decimal" autocomplete="off">
            </div>
            <div class="f" id="mTrocoBox" hidden>
              <label class="lab" for="mTroco">Troco pra (R$)</label>
              <input class="in sm" id="mTroco" inputmode="decimal" placeholder="opcional" autocomplete="off">
            </div>
          </div>

          <div class="f">
            <label class="lab" for="mRefri">Refri</label>
            <input class="in" id="mRefri" placeholder="sem refri" autocomplete="off">
          </div>
          <div class="f">
            <label class="lab" for="mObs">Observação</label>
            <input class="in" id="mObs" placeholder="sem observação" autocomplete="off">
          </div>

          <div class="notice warn" id="mErro" hidden></div>
          <div class="row">
            <button class="b1" id="mAdd" type="button">Adicionar pedido</button>
            <button class="b2" id="mCancel" type="button">Cancelar</button>
          </div>
        </div>
      </section>

      <section class="sum" id="sum" aria-label="Resumo da rota"></section>

      <div class="row">
        <button class="b2" id="copyall" type="button" style="flex:1 1 auto">Copiar lista toda</button>
        <button class="b1" id="terminar" type="button">Terminar rota</button>
      </div>
      <p class="hint" id="hintfim" hidden></p>
      <div class="notes" id="fim"></div>

      <section class="list" id="list" aria-label="Pedidos"></section>
      <p class="foot" id="foot" hidden></p>
    </div>

    <!-- TELA DO RELATÓRIO (aparece ao tocar em "Fechar entregas") -->
    <section class="stack" id="rel" hidden></section>

  </main>

  <!-- Aviso ao apertar "voltar" no celular (o app.js mostra e esconde) -->
  <div class="sair" id="sair" role="alertdialog" aria-modal="true" aria-labelledby="sairT" hidden>
    <div class="sair-box">
      <b id="sairT">Deseja realmente sair do aplicativo?</b>
      <p class="hint" id="sairMsg"></p>
      <div class="row">
        <button class="b1" id="sairNao" type="button">Ficar</button>
        <button class="b2" id="sairSim" type="button">Sair</button>
      </div>
    </div>
  </div>

  <!--
    A ORDEM IMPORTA:
      parser.js  cria parseOrders()
      storage.js cria "store" (onde os dados ficam guardados)
      app.js     usa os dois acima
  -->
  <script src="js/parser.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
