<!DOCTYPE html>
<!--
  index.html  —  O "esqueleto" da página
  ------------------------------------------------------------
  HTML só descreve O QUE existe na tela (título, caixa de texto,
  botões). A aparência está em css/style.css e o comportamento
  (o que acontece ao clicar) está em js/app.js.

  Os cards dos pedidos NÃO estão aqui: o app.js cria eles
  dentro de <section id="list">.
-->
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <!-- Faz a página se ajustar à largura do celular -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Leitor de Pedidos</title>

  <!-- Fontes do Google (se ficar sem internet, o navegador usa as fontes de reserva do CSS) -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">

  <!-- Nosso CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <main class="wrap">

    <header>
      <h1>Leitor de Pedidos</h1>
      <p class="lead">Cole as mensagens do WhatsApp. Cada pedido vira um card pronto pra colocar no Spoke.</p>
    </header>

    <!-- Área onde você cola as mensagens -->
    <section class="paste" aria-label="Mensagens">
      <div class="paste-head">
        <label class="lab" for="src">Mensagens coladas</label>
        <span class="demo" id="demo">Exemplo com dados inventados</span>
      </div>
      <textarea id="src" spellcheck="false" placeholder="Cole aqui as mensagens do WhatsApp"></textarea>
      <div class="row">
        <button class="b1" id="run" type="button">Ler pedidos</button>
        <button class="b2" id="clear" type="button">Limpar</button>
      </div>
    </section>

    <!-- Números do topo (o app.js preenche) -->
    <section class="sum" id="sum" aria-label="Resumo"></section>

    <div class="row">
      <button class="b2" id="copyall" type="button" style="flex:1 1 auto">Copiar lista toda</button>
    </div>

    <!-- Aqui entram os cards (o app.js preenche) -->
    <section class="list" id="list" aria-label="Pedidos"></section>
    <p class="foot" id="foot" hidden></p>

  </main>

  <!--
    A ORDEM IMPORTA: o parser.js vem primeiro porque o app.js usa a função
    parseOrders(), que é criada dentro do parser.js.
  -->
  <script src="js/parser.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
